<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demonstração interativa do site e do painel administrativo da Toninho Imóveis.">
<meta property="og:title" content="Toninho Imóveis — Demonstração">
<meta property="og:description" content="Encontre o imóvel ideal para você. Demonstração interativa do site e do painel administrativo.">
<meta name="theme-color" content="#0a0908">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0908'/%3E%3Cpath d='M12 31 32 14l20 17' fill='none' stroke='%23f97316' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M22 30h20M32 30v20' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Toninho Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: protótipo navegável do site público + painel, com a identidade do projeto (azul-marinho + dourado). Tema único claro, cores explícitas. */
:root{
  --navy-950:#0a0908; --navy-900:#141210; --navy-800:#1c1917; --navy-700:#292524; --navy-500:#57534e; --navy-100:#e7e5e4; --navy-50:#f6f5f4;
  --gold-600:#c2410c; --gold-500:#ea580c; --gold-400:#f97316; --gold-300:#fdba74; --gold-100:#ffedd5; --gold-50:#fff7ed;
  --ink:#171412; --muted:#625b55; --soft:#8f8781; --line:#e7e4e1; --bg:#f7f6f5; --card:#ffffff;
  --rose:#e11d48; --rose-50:#fff1f2; --green:#25d366; --green-dark:#1da851; --emerald:#047857; --emerald-50:#ecfdf5; --amber-50:#fffbeb; --amber:#b45309; --sky-50:#f0f9ff; --sky:#0369a1; --violet-50:#f5f3ff; --violet:#6d28d9; --slate-100:#f3f2f1;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgb(10 9 8/.04),0 8px 24px -8px rgb(10 9 8/.14);
  --shadow-h:0 2px 4px rgb(10 9 8/.06),0 20px 40px -12px rgb(10 9 8/.26);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--navy-500);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;transition:.18s;white-space:nowrap}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-navy{background:var(--navy-800);color:#fff}.btn-navy:hover{background:var(--navy-700)}
.btn-gold{background:var(--gold-400);color:var(--navy-950)}.btn-gold:hover{background:var(--gold-300)}
.btn-out{background:#fff;border:1px solid #d6d3d1;color:var(--ink)}.btn-out:hover{background:var(--navy-50);border-color:var(--navy-100)}
.btn-wa{background:var(--green);color:#fff}.btn-wa:hover{background:var(--green-dark)}
.btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover{background:var(--slate-100)}
.field{width:100%;border:1px solid #d6d3d1;border-radius:12px;padding:10px 12px;background:#fff;font-size:14px}
.field:focus{outline:none;border-color:var(--navy-500);box-shadow:0 0 0 4px rgb(249 115 22/.18)}
label.lb{display:block;font-size:13px;font-weight:600;color:#44403c;margin-bottom:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-600)}
.h2{font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--navy-950);margin-top:6px}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:3px 8px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.tag-navy{background:rgb(10 9 8/.9);color:#fff}.tag-rose{background:var(--rose);color:#fff}.tag-gold{background:var(--gold-400);color:var(--navy-950)}.tag-dark{background:#0a0908;color:#fff}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st-disponivel{background:var(--emerald-50);color:var(--emerald)}.st-reservado{background:var(--amber-50);color:var(--amber)}.st-vendido{background:var(--sky-50);color:var(--sky)}.st-alugado{background:var(--violet-50);color:var(--violet)}.st-indisponivel{background:var(--slate-100);color:#57534e}
.ld-novo{background:var(--rose-50);color:var(--rose)}.ld-em_atendimento{background:var(--amber-50);color:var(--amber)}.ld-contato_realizado{background:var(--sky-50);color:var(--sky)}.ld-visita_agendada{background:var(--violet-50);color:var(--violet)}.ld-finalizado{background:var(--emerald-50);color:var(--emerald)}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* barra da demonstração */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--navy-950);color:#d6d3d1;font-size:12.5px}
.demobar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:7px;flex-wrap:wrap}
.seg{display:inline-flex;background:rgb(255 255 255/.08);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#d6d3d1;font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:8px}
.seg button[aria-pressed=true]{background:var(--gold-400);color:var(--navy-950)}

/* site */
header.site{position:sticky;top:calc(env(safe-area-inset-top,0px) + 41px);z-index:50;background:rgb(255 255 255/.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:70px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.logo b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1;color:var(--navy-950)}
.logo i{display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.32em;color:var(--gold-600);margin-top:3px}
.logo.light b{color:#fff}.logo.light i{color:var(--gold-300)}
nav.main{display:flex;gap:2px}
nav.main button{border:0;background:none;padding:8px 11px;border-radius:9px;font-weight:700;font-size:14px;color:#57534e}
nav.main button:hover{background:#f8f7f6;color:var(--navy-800)}
nav.main button[aria-current=page]{background:var(--navy-50);color:var(--navy-800)}
.menu-btn{display:none}
@media (max-width:1060px){nav.main{display:none}.menu-btn{display:inline-flex}.hide-md{display:none!important}}
@media (max-width:560px){.hide-sm{display:none!important}}
.mnav{display:grid;gap:4px;padding:10px 0 16px}
.mnav button{border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;font-weight:700;color:#44403c}
.mnav button[aria-current=page]{background:var(--navy-50);color:var(--navy-800)}

.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 18% 20%,rgb(249 115 22/.24),transparent 40%),radial-gradient(circle at 85% 0%,rgb(249 115 22/.10),transparent 45%),linear-gradient(135deg,var(--navy-950),var(--navy-800) 55%,var(--navy-700))}
.hero .skyline{position:absolute;inset:auto 0 0 0;height:46%;opacity:.16;pointer-events:none}
.hero .wrap{position:relative;padding-block:64px 52px}
.hero h1{font-size:clamp(34px,5.6vw,60px);font-weight:800;line-height:1.05;max-width:760px}
.hero h1 em{font-style:normal;color:var(--gold-300)}
.hero .lead{margin-top:14px;max-width:560px;color:#e7e5e4;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid rgb(255 255 255/.16);background:rgb(255 255 255/.08);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--gold-100)}
.search{margin-top:30px;max-width:1000px;background:#fff;color:var(--ink);border-radius:18px;padding:10px;box-shadow:0 25px 60px -15px rgb(10 9 8/.55)}
.tabs{display:flex;gap:4px;padding:3px}
.tabs button{border:0;background:none;border-radius:9px;padding:7px 18px;font-weight:800;font-size:14px;color:#57534e}
.tabs button[aria-pressed=true]{background:var(--navy-800);color:#fff}
.sgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;margin-top:8px}
@media (max-width:860px){.sgrid{grid-template-columns:1fr}}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--gold-500)}
.sbox input,.sbox select{border:0;outline:0;background:transparent;width:100%;padding:13px 0;font-size:14px;color:var(--ink)}
.trust{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:28px;font-size:14px}
.trust span{display:flex;align-items:center;gap:7px;color:#d6d3d1}.trust b{color:#fff}

section.blk{padding-block:56px}
section.white{background:#fff}
.shead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:26px}
.shead p.sub{margin-top:6px;color:var(--muted)}
.link{border:0;background:none;font-weight:800;font-size:14px;color:var(--navy-700);display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

.pcard{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.25s;padding:0;width:100%}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.pcard .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--navy-50)}
.pcard .ph svg.photo{width:100%;height:100%;display:block;transition:transform .5s}
.pcard:hover .ph svg.photo{transform:scale(1.05)}
.pcard .tags{position:absolute;top:10px;left:10px;display:flex;flex-wrap:wrap;gap:5px}
.pcard .code{position:absolute;right:10px;bottom:10px;background:rgb(255 255 255/.92);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;color:#44403c}
.pcard .stat{position:absolute;left:10px;bottom:10px}
.pcard .bd{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.pcard .cat{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-600)}
.pcard h3{font-size:15.5px;font-weight:800;color:var(--navy-950);margin-top:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .loc{display:flex;gap:4px;align-items:center;color:var(--soft);font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-block:1px solid #efedeb;margin-top:14px;padding-block:10px;font-size:12px;color:#57534e;text-align:center}
.facts span{display:flex;flex-direction:column;align-items:center;gap:3px}.facts svg{color:var(--navy-500);width:16px;height:16px}
.pcard .ft{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px;flex:1}
.price{font-size:19px;font-weight:800;color:var(--navy-900)}
.price.promo{color:var(--rose)}
.old{font-size:12px;color:var(--soft)}.old s{color:var(--soft)}
.ver{display:inline-flex;align-items:center;gap:4px;background:var(--navy-50);color:var(--navy-800);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800;transition:.2s}
.pcard:hover .ver{background:var(--navy-800);color:#fff}

.cats{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.catb{display:flex;flex-direction:column;align-items:flex-start;gap:12px;border:1px solid var(--line);background:#faf9f8;border-radius:16px;padding:18px;text-align:left;transition:.2s}
.catb:hover{background:#fff;box-shadow:var(--shadow);transform:translateY(-2px)}
.catb .ico{background:var(--navy-800);color:var(--gold-300);border-radius:12px;padding:10px;display:flex}
.catb b{display:block;color:var(--navy-950)}.catb small{color:var(--soft);font-size:12px}

.cta{position:relative;overflow:hidden;border-radius:26px;background:var(--navy-900);color:#fff;padding:44px clamp(22px,4vw,52px);display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:center}
.cta::before{content:"";position:absolute;width:300px;height:300px;right:-90px;top:-110px;border-radius:50%;background:rgb(249 115 22/.24);filter:blur(50px)}
@media (max-width:820px){.cta{grid-template-columns:1fr}}
.cta h2{font-size:clamp(24px,3.2vw,36px);font-weight:800;margin-top:6px}
.cta p{color:#d6d3d1;margin-top:10px;max-width:540px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vals div{border:1px solid var(--line);border-radius:16px;padding:18px}
.vals b{display:block;margin-top:10px;color:var(--navy-950)}.vals small{color:var(--muted);font-size:13px}
.vals svg{color:var(--gold-500);width:26px;height:26px}
footer.site{background:var(--navy-950);color:#a8a29e;margin-top:0}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;padding-block:52px}
@media (max-width:860px){footer.site .cols{grid-template-columns:1fr 1fr}}
@media (max-width:480px){footer.site .cols{grid-template-columns:1fr}}
footer.site h4{color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px}
footer.site li{list-style:none;margin:8px 0;font-size:14px}
footer.site ul{padding:0;margin:0}
footer.site button{border:0;background:none;color:#a8a29e;padding:0}
footer.site button:hover{color:var(--gold-300)}
.fbar{border-top:1px solid rgb(255 255 255/.08);font-size:12px;color:#78716c}
.fbar .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding-block:16px}
.wa-float{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;border:0;background:var(--green);color:#fff;border-radius:50%;padding:14px;box-shadow:0 10px 25px -6px rgb(0 0 0/.35);display:flex}
.wa-float:hover{background:var(--green-dark);transform:scale(1.05)}

/* listagem */
.phero{background:radial-gradient(circle at 80% 0%,rgb(249 115 22/.12),transparent 45%),linear-gradient(135deg,var(--navy-950),var(--navy-800));color:#fff}
.phero .wrap{padding-block:38px}
.crumb{font-size:12px;color:#d6d3d1;margin-bottom:8px}
.phero h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.phero p{color:#d6d3d1;margin-top:6px}
.listing{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;padding-block:30px 56px}
@media (max-width:960px){.listing{grid-template-columns:1fr}}
.filters{padding:20px;align-self:start;position:sticky;top:130px}
@media (max-width:960px){.filters{position:static}}
.filters h3{font-size:15px;font-weight:800;color:var(--navy-950);margin-bottom:14px;display:flex;gap:8px;align-items:center}
.fgroup{margin-bottom:14px}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cnt button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 0;font-size:12px;font-weight:800;color:#57534e}
.cnt button[aria-pressed=true]{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.empty{padding:50px 20px;text-align:center}
.empty b{display:block;font-size:18px;color:var(--navy-950);margin-top:10px}

/* imóvel */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:28px;padding-block:8px 50px}
@media (max-width:980px){.pgrid{grid-template-columns:1fr}}
.gal{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:var(--navy-900)}
.gal svg.photo{width:100%;height:100%;display:block}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgb(255 255 255/.92);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#292524;box-shadow:0 6px 16px rgb(0 0 0/.2)}
.gal .info{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.gal .info span{background:rgb(0 0 0/.6);color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;width:104px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:0;padding:0;outline:2px solid transparent;opacity:.65}
.thumbs button[aria-current=true]{outline-color:var(--gold-400);opacity:1}
.thumbs svg{width:100%;height:100%;display:block}
.box{padding:22px}
.box h2{font-size:17px;font-weight:800;color:var(--navy-950);margin-bottom:14px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.dgrid{grid-template-columns:1fr 1fr}}
.dgrid div{display:flex;gap:10px;align-items:center;background:#f8f7f6;border-radius:12px;padding:10px}
.dgrid .i{background:#fff;border-radius:9px;padding:7px;color:var(--navy-500);display:flex;box-shadow:0 1px 3px rgb(0 0 0/.06)}
.dgrid small{display:block;font-size:11.5px;color:var(--soft)}.dgrid b{color:var(--navy-950)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;padding:0;margin:0}
@media (max-width:560px){.feat{grid-template-columns:1fr 1fr}}
.feat li{list-style:none;display:flex;gap:8px;align-items:center;font-size:14px;color:#44403c}
.feat li span{background:var(--emerald-50);color:var(--emerald);border-radius:50%;display:flex;padding:3px}
.side{display:grid;gap:16px;align-self:start}
@media (max-width:980px){.side{position:static}}
.big{font-size:30px;font-weight:800;color:var(--navy-900)}
.big.promo{color:var(--rose)}
.save{display:inline-block;margin-top:6px;background:var(--rose-50);color:#be123c;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:800}
.share{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.share button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 4px;font-size:12px;font-weight:700;color:#44403c;display:flex;align-items:center;justify-content:center;gap:5px}

/* overlays */
.lightbox{position:fixed;inset:0;z-index:90;background:rgb(0 0 0/.94);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.lightbox .top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:6px 8px}
.lightbox .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.lightbox .stage svg.photo{max-width:min(1100px,100%);max-height:100%;width:100%;height:auto;aspect-ratio:16/10;border-radius:8px}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgb(255 255 255/.12);color:#fff;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:16px;left:16px;z-index:100;display:grid;justify-items:end;gap:8px;pointer-events:none}
.toast{pointer-events:auto;max-width:420px;background:#fff;border:1px solid #bbf7d0;color:#065f46;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600;box-shadow:0 12px 30px -10px rgb(0 0 0/.25);display:flex;gap:9px;align-items:flex-start;animation:tin .25s ease}
.toast.info{border-color:var(--navy-100);color:var(--navy-800)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.modal{position:fixed;inset:0;z-index:95;background:rgb(10 9 8/.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:440px;width:100%;padding:22px}
.wa-preview{background:#e7f8ee;border-radius:12px 12px 12px 3px;padding:12px 14px;color:#14532d;font-size:14px;margin-top:12px}

/* painel */
.adm{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 41px)}
@media (max-width:900px){.adm{grid-template-columns:1fr}}
.aside{background:var(--navy-950);color:#d6d3d1;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
@media (max-width:900px){.aside{flex-direction:row;overflow-x:auto;padding:10px 12px;gap:6px}.aside .logo,.aside .who{display:none}}
.aside .logo{padding:0 10px 18px}
.aside button.it{border:0;background:none;color:#d6d3d1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font-weight:700;font-size:14px;text-align:left;white-space:nowrap}
.aside button.it:hover{background:rgb(255 255 255/.06);color:#fff}
.aside button.it[aria-current=page]{background:rgb(255 255 255/.1);color:#fff}
.aside button.it[aria-current=page] svg{color:var(--gold-300)}
.aside .badge{margin-left:auto;background:var(--rose);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.aside .who{margin-top:auto;border-top:1px solid rgb(255 255 255/.1);padding:14px 12px 0;font-size:13px}
.amain{padding:28px clamp(16px,3vw,36px) 60px;min-width:0}
.ahead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
.ahead h1{font-size:24px;font-weight:800;color:var(--navy-950)}
.ahead p{color:var(--muted);font-size:14px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.stats .card{padding:16px;text-align:left;border:1px solid var(--line)}
.stats .ic2{display:inline-flex;border-radius:11px;padding:9px}
.stats b{display:block;font-size:26px;font-weight:800;color:var(--navy-950);margin-top:10px;line-height:1.1}
.stats small{color:var(--muted);font-size:12.5px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 14px;border-bottom:1px solid #f2f0ee;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.thumb{width:62px;height:46px;border-radius:9px;overflow:hidden;flex:none}
.thumb svg{width:100%;height:100%;display:block}
.scroll-x{overflow-x:auto}
.menu{position:absolute;right:0;top:100%;margin-top:4px;z-index:30;width:230px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -12px rgb(0 0 0/.25);padding:5px 0}
.menu button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:none;text-align:left;padding:8px 13px;font-size:13.5px;color:#44403c}
.menu button:hover{background:#f8f7f6}
.menu hr{border:0;border-top:1px solid #f2f0ee;margin:4px 0}
.lead{padding:16px 18px}
.login{min-height:calc(100vh - 41px);display:grid;grid-template-columns:1fr 1fr}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .art{display:none}}
.login .art{padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.note{background:var(--gold-50);border:1px solid var(--gold-100);color:#9a3412;border-radius:12px;padding:10px 12px;font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:-8px 0 12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.checks label,.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:#44403c}
.checks input,.chk input{width:18px;height:18px;accent-color:#ea580c;flex:none}
.faq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#faf9f8}
.faq .field{background:#fff}
.chat-log{display:grid;gap:6px;margin-top:10px;background:#f8f7f6;border-radius:12px;padding:12px}
.chat-log p{max-width:85%;padding:7px 11px;border-radius:12px;font-size:13.5px;background:#fff;border:1px solid var(--line)}
.chat-log p.u{justify-self:end;background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
details summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--navy-700);margin-top:8px}

/* assistente virtual */
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gold-400);color:var(--navy-950);display:flex;align-items:center;justify-content:center}
.chat-launch{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;border:0;border-radius:99px;background:var(--navy-950);color:#fff;padding:7px 18px 7px 7px;font-weight:800;font-size:14px;box-shadow:0 14px 30px -8px rgb(10 9 8/.5);transition:.2s}
.chat-launch:hover{transform:translateY(-2px);background:var(--navy-800)}
.chat-launch .av{position:relative;width:40px;height:40px}
.chat-launch .av::after{content:"";position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid var(--navy-950)}
@media (max-width:480px){.chat-launch{padding:7px}.chat-launch .lbl{display:none}}
body.has-chat .wa-float{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.chat-teaser{position:fixed;right:18px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:45;max-width:280px;background:#fff;border:1px solid var(--line);border-radius:16px 16px 4px 16px;box-shadow:var(--shadow-h);padding:12px 36px 12px 14px;font-size:14px;text-align:left;animation:tin .3s ease}
.chat-teaser .x{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--soft);padding:4px;display:flex}
.chat{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:96;width:min(400px,calc(100vw - 36px));height:min(640px,calc(100dvh - 80px));background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 70px -20px rgb(10 9 8/.55);display:flex;flex-direction:column;overflow:hidden;animation:cin .22s ease}
@keyframes cin{from{transform:translateY(12px);opacity:0}}
@media (max-width:560px){.chat{inset:0;width:auto;height:auto;border:0;border-radius:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;background:var(--navy-950);color:#fff}
.chat-h b{display:block;font-size:15px;line-height:1.2}
.chat-h small{display:flex;align-items:center;gap:5px;color:#d6d3d1;font-size:12px}
.chat-h small i{width:7px;height:7px;border-radius:50%;background:#22c55e}
.chat-h .hb{border:0;background:rgb(255 255 255/.08);color:#fff;border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none}
.chat-h .hb:hover{background:rgb(255 255 255/.16)}
.chat-h .hb.wa{background:var(--green)}
.chat-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.user{background:var(--navy-800);color:#fff;border-bottom-right-radius:5px;align-self:flex-end;white-space:pre-wrap}
.msg p+p,.msg p+ul,.msg ul+p{margin-top:6px}
.msg ul{margin:4px 0 0;padding-left:18px}
.msg .basic{display:block;margin-top:6px;font-size:11px;color:var(--soft)}
.mcards{display:grid;gap:8px;align-self:stretch;max-width:92%}
.mcard{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px;width:100%;transition:.15s}
.mcard:hover{border-color:var(--gold-300);box-shadow:var(--shadow)}
.mcard .thumb{width:76px;height:57px}
.mcard b{font-size:13px;line-height:1.3;color:var(--navy-950);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard small{display:block;font-size:12px;color:var(--soft)}
.mcard .pr{display:block;font-weight:800;color:var(--navy-900);font-size:13px;margin-top:2px}
.mcard .pr.promo{color:var(--rose)}
.chat-body .handoff{align-self:flex-start;padding:10px 14px;font-size:13.5px}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--soft);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px;background:var(--bg)}
.chips button{border:1px solid var(--gold-300);background:#fff;color:var(--gold-600);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:700;text-align:left}
.chips button:hover{background:var(--gold-50)}
.chat-f{display:flex;gap:8px;padding:10px 12px 6px;border-top:1px solid var(--line);background:#fff;align-items:flex-end}
.chat-f textarea{flex:1;resize:none;border:1px solid #d6d3d1;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4;height:42px;max-height:120px}
.chat-f textarea:focus{outline:none;border-color:var(--navy-500);box-shadow:0 0 0 4px rgb(249 115 22/.18)}
@media (max-width:560px){.chat-f textarea{font-size:16px}}
.chat-f .send{border:0;background:var(--gold-400);color:var(--navy-950);border-radius:12px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none}
.chat-f .send:disabled{opacity:.45;cursor:not-allowed}
.chat-note{font-size:11px;color:var(--soft);text-align:center;padding:0 12px 8px;background:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function pageList(kind){
  const T={comprar:['Imóveis à Venda','Encontre o imóvel para morar ou investir.'],alugar:['Imóveis para Alugar','Opções para morar ou trabalhar.'],imoveis:['Imóveis','Combine filtros para encontrar o imóvel ideal.'],ofertas:['Ofertas','Imóveis com preço promocional por tempo limitado.']}[kind];
  const f=S.filters;let list=visible();
  if(kind==='comprar')list=list.filter(p=>p.purpose==='venda');
  if(kind==='alugar')list=list.filter(p=>p.purpose==='aluguel');
  if(kind==='ofertas')list=list.filter(hasOffer);
  if(kind==='imoveis'&&f.purpose)list=list.filter(p=>p.purpose===f.purpose);
  if(f.q){const w=norm(f.q).split(/\s+/).filter(Boolean);list=list.filter(p=>w.every(x=>norm(`${p.code} ${p.title} ${p.nb} ${p.city}`).includes(x)))}
  if(f.cat)list=list.filter(p=>p.cat===f.cat);
  if(f.bed)list=list.filter(p=>p.bed>=f.bed);
  if(f.bath)list=list.filter(p=>p.bath>=f.bath);
  if(f.park)list=list.filter(p=>p.park>=f.park);
  if(f.max)list=list.filter(p=>eff(p)<=f.max);
  if(f.min)list=list.filter(p=>eff(p)>=f.min);
  const ord={disponivel:0,reservado:1,vendido:2,alugado:3,indisponivel:4};
  list=[...list].sort((a,b)=>ord[a.status]-ord[b.status]||(f.sort==='menor'?eff(a)-eff(b):f.sort==='maior'?eff(b)-eff(a):b.code.localeCompare(a.code)));
  const cnt=(k,l)=>`<div class="fgroup"><span class="lb" style="display:block;font-size:13px;font-weight:600;color:#44403c;margin-bottom:5px">${l}</span><div class="cnt">${[0,1,2,3,4].map(n=>`<button type="button" data-cnt="${k}" data-n="${n}" aria-pressed="${(f[k]||0)===n}">${n?n+'+':'Todos'}</button>`).join('')}</div></div>`;
  return `<section class="phero"><div class="wrap"><p class="crumb">Início › ${T[0]}</p><h1>${T[0]}</h1><p>${T[1]}</p></div></section>
  <div class="wrap listing"><aside class="card filters" aria-label="Filtros"><h3>${ic('sliders',16)} Busca avançada</h3>
   ${kind==='imoveis'?`<div class="fgroup"><span style="display:block;font-size:13px;font-weight:600;color:#44403c;margin-bottom:5px">Negociação</span><div class="cnt" style="grid-template-columns:repeat(3,1fr)">${[['','Todos'],['venda','Venda'],['aluguel','Aluguel']].map(([v,l])=>`<button type="button" data-fp="${v}" aria-pressed="${(f.purpose||'')===v}">${l}</button>`).join('')}</div></div>`:''}
   <div class="fgroup"><label class="lb" for="f-q">Cidade, bairro ou código</label><input class="field" id="f-q" value="${esc(f.q||'')}" placeholder="Ex.: Centro, 0001"></div>
   <div class="fgroup"><label class="lb" for="f-cat">Tipo de imóvel</label><select class="field" id="f-cat"><option value="">Todos os tipos</option>${CATS.map(c=>`<option value="${c[0]}" ${f.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>
   ${cnt('bed','Quartos')}${cnt('bath','Banheiros')}${cnt('park','Vagas')}
   <div class="fgroup"><span style="display:block;font-size:13px;font-weight:600;color:#44403c;margin-bottom:5px">Valor (R$)</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="field" id="f-min" inputmode="numeric" placeholder="Mínimo" aria-label="Valor mínimo" value="${f.min||''}"><input class="field" id="f-max" inputmode="numeric" placeholder="Máximo" aria-label="Valor máximo" value="${f.max||''}"></div></div>
   <div style="display:flex;gap:8px"><button class="btn btn-out" data-clear style="flex:1">Limpar</button><button class="btn btn-navy" data-apply style="flex:2">Aplicar filtros</button></div></aside>
   <div style="min-width:0"><div class="lhead"><b style="color:var(--navy-950)">${list.length} ${list.length===1?'imóvel encontrado':'imóveis encontrados'}</b>
    <select class="field" id="f-sort" style="width:auto" aria-label="Ordenar"><option value="">Mais recentes</option><option value="menor" ${f.sort==='menor'?'selected':''}>Menor preço</option><option value="maior" ${f.sort==='maior'?'selected':''}>Maior preço</option></select></div>
    ${list.length?grid(list):`<div class="card empty">${ic('search',34)}<b>Nenhum imóvel encontrado</b><p style="color:var(--muted);margin-top:6px">Tente ampliar a busca ou fale com a nossa equipe.</p><button class="btn btn-out" data-clear style="margin-top:16px">Limpar filtros</button></div>`}</div></div>`;
}

  let body;

async function askGemini(contents,b=DB.bot,sys=systemPrompt(b)){
  const body={systemInstruction:{parts:[{text:sys}]},contents,generationConfig:{temperature:.5,maxOutputTokens:2048}};
  const proxy=b.proxy||GEMINI_PROXY_URL;
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),30000);
  let res;
  try{
    res=proxy
     ?await fetch(proxy,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:b.model,...body}),signal:ctrl.signal})
     :await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(b.model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':b.apiKey},body:JSON.stringify(body),signal:ctrl.signal});
  }catch(e){throw new Error(e.name==='AbortError'?'tempo esgotado':'sem conexão com o Gemini')}
  finally{clearTimeout(tm)}
  const j=await res.json().catch(()=>({}));
  if(!res.ok){
    const m=(j.error&&j.error.message)||'';
    if(res.status===429)throw new Error('limite gratuito do Gemini atingido, tente em instantes');
    if(res.status===404)throw new Error(`modelo "${b.model}" indisponível`);
    if(/api key/i.test(m)||res.status===401||res.status===403)throw new Error('chave da API inválida');
    throw new Error(m||`erro ${res.status}`);
  }
  const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
  const text=parts.filter(x=>!x.thought).map(x=>x.text||'').join('').trim();
  if(!text)throw new Error('o Gemini não retornou resposta');
  return text;
}

  const ph=text.match(/(?:\+?55\s?)?\(?\d{2}\)?\s?9?\d{4}[-.\s]?\d{4}/);
  if(ph&&phoneOk(ph[0])){
    let nome=(text.match(/(?:meu nome é|meu nome e|me chamo|sou o|sou a|aqui é o|aqui é a|aqui e o|aqui e a)\s+([A-Za-zÀ-ÿ]+(?:\s+[A-Za-zÀ-ÿ]+)?)/i)||[])[1];
    if(!nome){const rest=text.replace(ph[0],'').replace(/[^A-Za-zÀ-ÿ\s]/g,' ').split(/\s+/).filter(w=>w&&!/^(meu|nome|telefone|tel|whats|whatsapp|celular|numero|número|é|e|o|a|ok|segue)$/i.test(w));if(rest.length&&rest.length<=3)nome=rest.join(' ')}
    const u=CHAT.msgs.filter(m=>m.role==='user'&&m.text!==text).map(m=>m.text).slice(-3).join(' / ');
    const lead={nome:nome||'',telefone:ph[0].trim(),resumo:u?`Conversou sobre: ${u.slice(0,200)}`:''};
    return out(`Obrigado${nome?', '+nome.split(' ')[0]:''}! 😊 Anotei seu contato e um corretor vai te chamar em breve. Se preferir adiantar, é só tocar no botão abaixo.`,{handoff:true,lead});
  }
  if(/^(oi+|ola|bom dia|boa tarde|boa noite|e ai|opa|hey|hello|tudo bem)\b/.test(t)&&t.split(/\s+/).length<=4)
    return out('Olá! 😊 Posso te ajudar a encontrar um imóvel para comprar ou alugar, tirar dúvidas ou te passar para um corretor. O que você procura?');
  if(/\b(obrigad|valeu|agradec)/.test(t))return out('Por nada! Se precisar, é só chamar. E quando quiser, um corretor te atende pelo WhatsApp.',{handoff:true});
  // código de imóvel citado
  const cm=t.match(/#?\b(\d{4})\b/);const cp=cm&&visible().find(p=>p.code===cm[1]);
  if(cp)return out(propSummary(cp,t),{cards:[cp.code],handoff:true});
  if(/\b(corretor|atendente|humano|pessoa|whats|whatsapp|zap|visita|visitar|agendar|proposta|negociar|ligar|ligacao)\b/.test(t))
    return out(`Claro! Um corretor pode te atender pelo WhatsApp ${c.whatsapp} (${c.hours}).${CHAT.lead?'':' Se quiser, me diga seu nome e telefone com DDD que eu já deixo anotado para ele.'}`,{handoff:true});
  // perguntas frequentes
  let best=null,score=0;const tw=kw(text);
  for(const f of b.faq){const w=kw(f.q);if(!w.length)continue;const hit=w.filter(x=>tw.some(y=>y===x||(y.length>=5&&x.startsWith(y))||(x.length>=5&&y.startsWith(x)))).length;const sc=hit/w.length;if(hit&&sc>score){score=sc;best=f}}
  if(best&&score>=.6)return out(best.a,{handoff:true});
  // dúvidas sobre o imóvel aberto
  const cur=S.page==='imovel'&&visible().find(p=>p.code===S.code);
  if(cur&&/\b(esse|este|desse|deste|dele|nele|iptu|condominio|area|metragem|quartos|vagas|aceita|pet|pets|animais|valor|preco)\b/.test(t))return out(propSummary(cur,t),{handoff:true});
  if(/\b(endereco|onde fica|localizacao|horario|funciona|abre|fecha|telefone|email|contato|instagram|facebook)\b/.test(t))
    return out(`Aqui estão nossos contatos:\n- 📍 ${c.address}\n- 🕒 ${c.hours}\n- 📞 ${c.phone}\n- ✉️ ${c.email}`,{handoff:true});
  // busca de imóveis
  const f={};
  if(/\b(alug|locac|locar|loca)/.test(t))f.purpose='aluguel';else if(/\b(compr|vend|adquir|investir)/.test(t))f.purpose='venda';
  for(const [k,rx] of CAT_RX)if(rx.test(t)){f.cat=k;break}
  const bm=t.match(/(\d)\s*(quartos?|dorm\w*|qtos?|suites?)/);if(bm)f.bed=Number(bm[1]);
  for(const m of t.matchAll(/(\d[\d.]*(?:,\d+)?)\s*(mil|k|milhao|milhoes|mi)?\b(?!\s*(quarto|dorm|qto|vaga|banh|suite|m2|metro|alqueire))/g)){
    let n=Number(m[1].replace(/\./g,'').replace(',','.'));if(m[2]==='mil'||m[2]==='k')n*=1e3;else if(m[2])n*=1e6;
    if(n>=300){f.max=n;break}
  }
  const nb=[...new Set(visible().map(p=>p.nb))].find(x=>t.includes(norm(x)));if(nb)f.nb=nb;
  if(/\b(oferta|promoc|desconto|barat)/.test(t))f.offer=true;
  const FX=[['Piscina',/piscina/],['Aceita animais',/\b(pet|pets|animal|animais|cachorro|gato)\b/],['Mobiliado',/mobiliad/],['Churrasqueira',/churrasq/]].filter(([,rx])=>rx.test(t)).map(([n])=>n);
  if(Object.keys(f).length||FX.length){
    let list=active();
    if(f.purpose)list=list.filter(p=>p.purpose===f.purpose);if(f.cat)list=list.filter(p=>p.cat===f.cat||(f.cat==='casa'&&p.cat==='condominio'));
    if(f.bed)list=list.filter(p=>p.bed>=f.bed);if(f.max)list=list.filter(p=>eff(p)<=f.max);if(f.nb)list=list.filter(p=>p.nb===f.nb);if(f.offer)list=list.filter(hasOffer);
    if(FX.length)list=list.filter(p=>FX.every(x=>p.feats.includes(x)));
    list.sort((a,b2)=>f.max?eff(a)-eff(b2):(b2.featured-a.featured));
    if(!list.length)return out('Não encontrei nenhum imóvel com essas características no momento. 😕 Mas nossos corretores conhecem opções que ainda nem chegaram ao site. Quer falar com um deles?',{handoff:true});
    const n=list.length;
    return out(`Encontrei ${n} ${n>1?'opções':'opção'} para você${n>3?'. Estas são as que mais combinam':''}:`+`\n\nToque em um imóvel para ver fotos e detalhes. Quer que um corretor te ajude com visita ou mais informações?`,{cards:list.slice(0,3).map(p=>p.code),handoff:true});
  }
  if(best)return out(best.a,{handoff:true});
  return out('Desculpe, não entendi muito bem. 🤔 Posso buscar imóveis (ex.: "casa para alugar até 2 mil" ou "apartamento 2 quartos à venda"), responder dúvidas sobre financiamento, documentos e visitas, ou te passar para um corretor.',{handoff:true});
}

function md(s){
  let h='',list=false;
  for(const l of esc(s).split('\n')){
    const m=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if(m){if(!list){h+='<ul>';list=true}h+=`<li>${m[1]}</li>`;continue}
    if(list){h+='</ul>';list=false}
    if(l.trim())h+=`<p>${l}</p>`;
  }
  if(list)h+='</ul>';
  return h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function handoffMsg(){
  const L=CHAT.lead||{},codes=[...new Set(CHAT.msgs.flatMap(m=>m.cards||[]))];
  if(S.page==='imovel'&&S.code&&!codes.includes(S.code))codes.unshift(S.code);
  let m=`Olá! Vim pelo assistente virtual do site da ${C().name}.`;
  if(L.nome)m+=` Meu nome é ${L.nome}.`;
  if(L.resumo&&!/^Conversou sobre/.test(L.resumo))m+=` Procuro: ${L.resumo.replace(/[.\s]+$/,'')}.`;
  else{const u=CHAT.msgs.filter(x=>x.role==='user').map(x=>x.text);if(u.length)m+=` Conversei sobre: "${u.slice(-2).join(' / ').slice(0,220)}".`}
  if(codes.length)m+=` Imóveis de interesse: ${codes.slice(0,4).map(c=>'#'+c).join(', ')}.`;
  return m;
}
const waHref=()=>`https://wa.me/${waNum()}?text=${encodeURIComponent(handoffMsg())}`;
function registerLead(L){
  if(!L||!phoneOk(L.telefone||''))return;
  CHAT.lead={...CHAT.lead,...L};
  const codes=CHAT.msgs.flatMap(m=>m.cards||[]);
  const msg=`[${DB.bot.name}] ${L.resumo||'Contato deixado no chat do site.'}`;
  const ex=DB.leads.find(l=>l.chat&&l.chat===CHAT.id);
  if(ex)Object.assign(ex,{name:L.nome||ex.name,phone:L.telefone,msg});
  else DB.leads.unshift({id:Date.now(),name:L.nome||'Visitante do chat',phone:L.telefone,email:'',code:S.page==='imovel'?S.code:(codes[0]||null),msg,status:'novo',date:now(),src:'chat',chat:CHAT.id});
}
function persistChat(extra={}){
  if(!CHAT.msgs.some(m=>m.role==='user'))return;
  if(!CHAT.id)CHAT.id=Date.now();
  let c=DB.chats.find(x=>x.id===CHAT.id);
  if(!c){c={id:CHAT.id,date:now(),page:pageLabel()};DB.chats.unshift(c);DB.chats=DB.chats.slice(0,60)}
  Object.assign(c,{msgs:CHAT.msgs.filter(m=>!m.greet).map(m=>({role:m.role,text:m.text,cards:m.cards,basic:m.basic})),lead:CHAT.lead?(CHAT.lead.nome||'Contato deixado'):null,ai:aiReady()},extra);
  saveDB();
}
async function chatSend(text){
  text=String(text||'').trim().slice(0,800);
  if(!text||CHAT.busy)return;
  if(!CHAT.id)CHAT.id=Date.now();
  CHAT.msgs.push({role:'user',text});CHAT.busy=true;CHAT.draft='';renderChat();
  let r;
  if(aiReady()){
    try{r=parseReply(await askGemini(geminiContents()))}
    catch(err){console.warn('Gemini:',err.message);r=basicReply(text);r.err=err.message}
  }else{await new Promise(ok=>setTimeout(ok,500+Math.random()*400));r=basicReply(text)}
  if(r.lead)registerLead(r.lead);
  CHAT.msgs.push({role:'bot',text:r.text,raw:r.raw,cards:r.cards,handoff:r.handoff,basic:r.basic,err:r.err});
  CHAT.busy=false;persistChat();renderChat(true);
}
function openChat(){CHAT.open=true;CHAT.teaser=false;try{sessionStorage.setItem('toninho-teaser','1')}catch(e){}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-chat-open],[data-chat-close],[data-chat-reset],[data-chat-chip],[data-chat-teaser-x],[data-chat-ask],[data-chat-test],[data-handoff],.chat .mcard');
  if(!t)return;const d=t.dataset;
  if(d.chatOpen!==undefined)openChat();
  else if(d.chatClose!==undefined){CHAT.open=false;renderChat()}
  else if(d.chatReset!==undefined)resetChat();
  else if(d.chatChip){openChat();chatSend(d.chatChip)}
  else if(d.chatTeaserX!==undefined){CHAT.teaser=false;try{sessionStorage.setItem('toninho-teaser','1')}catch(e2){}renderChat()}
  else if(d.chatAsk){openChat();chatSend(`Tenho dúvidas sobre o imóvel #${d.chatAsk}`)}

  else if(d.handoff!==undefined){if(CHAT.id)persistChat({handoff:true})}

  const t=e.target.closest('[data-faq-add],[data-faq-del],[data-bot-ping],[data-bot-defaults],[data-chats-clear]');if(!t)return;const d=t.dataset;
  if(d.faqAdd!==undefined){const b=readBotForm();b.faq.push({q:'',a:''});S.botDraft=b;render();const q=document.querySelectorAll('[data-fq]');q[q.length-1].focus()}
  else if(d.faqDel!==undefined){const b=readBotForm();b.faq.splice(Number(d.faqDel),1);S.botDraft=b;render()}
  else if(d.botDefaults!==undefined){const b=readBotForm();S.botDraft={...b,name:DEFAULT_BOT.name,greeting:DEFAULT_BOT.greeting,instructions:DEFAULT_BOT.instructions,knowledge:DEFAULT_BOT.knowledge,faq:JSON.parse(JSON.stringify(DEFAULT_BOT.faq)),chips:[...DEFAULT_BOT.chips]};render();toast('Textos padrão carregados. Clique em Salvar para aplicar.','info')}
  else if(d.botPing!==undefined){
    const b=readBotForm(),res=document.getElementById('ping-res');
    if(!aiReady(b)){res.style.color='var(--rose)';res.textContent='Informe a chave da API ou a URL do proxy.';return}
    t.disabled=true;res.style.color='var(--muted)';res.textContent='Testando...';
    try{const r=await askGemini([{role:'user',parts:[{text:'Responda apenas com a palavra OK.'}]}],b,'Você é um teste de conexão.');res.style.color='var(--emerald)';res.textContent=`Conectado! O Gemini respondeu: "${r.slice(0,40)}". Clique em Salvar assistente.`}
    catch(err){res.style.color='var(--rose)';res.textContent='Não conectou: '+err.message+'.'}
    t.disabled=false;
  }
  else if(d.chatsClear!==undefined){if(confirm('Apagar todas as conversas do chat? Os interessados continuam salvos.')){DB.chats=[];toast('Conversas apagadas.');render()}}
});
document.addEventListener('submit',e=>{if(e.target.id!=='bot-form')return;e.preventDefault();
  const b=readBotForm();b.faq=b.faq.filter(f=>f.q&&f.a);DB.bot=b;S.botDraft=null;CHAT.msgs=CHAT.msgs.filter(m=>!m.greet);
  toast(`Assistente salvo! ${b.enabled?(aiReady(b)?'Usando a IA do Gemini.':'Funcionando no modo básico.'):'Ele está oculto no site.'}`);render()});
function admChats(){
  const L=DB.chats;
  return adminShell(`<div class="ahead"><div><h1>Conversas do chat</h1><p>${L.length?`${L.length} conversa${L.length>1?'s':''} com o ${esc(DB.bot.name)}. Contatos deixados no chat também aparecem em Interessados.`:'As conversas dos clientes com o assistente aparecem aqui.'}</p></div>${L.length?`<button class="btn btn-out" data-chats-clear>${ic('trash',16)} Apagar conversas</button>`:''}</div>
   ${L.length?`<div style="display:grid;gap:12px">${L.map(c=>{const n=c.msgs.filter(m=>m.role==='user').length;return `<div class="card lead"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px"><div><b style="color:var(--navy-950)">${c.lead?esc(c.lead):'Visitante anônimo'}</b> ${c.lead?'<span class="pill ld-novo">Deixou contato</span>':''} ${c.handoff?`<span class="pill" style="background:#dcfce7;color:#15803d">Foi para o WhatsApp</span>`:''}
     <p style="color:var(--muted);font-size:13px;margin-top:3px">${c.date} · começou em ${esc(c.page)} · ${n} mensage${n>1?'ns':'m'} do cliente · ${c.ai?'IA Gemini':'modo básico'}</p></div></div>
     <p style="font-size:14px;color:#44403c;margin-top:8px">“${esc((c.msgs.find(m=>m.role==='user')||{}).text||'')}”</p>
     <details><summary>Ver conversa completa</summary><div class="chat-log">${c.msgs.map(m=>`<p class="${m.role==='user'?'u':''}">${esc(m.text)}${(m.cards||[]).length?`<br><small style="color:${m.role==='user'?'var(--gold-300)':'var(--gold-600)'};font-weight:700">Imóveis indicados: ${m.cards.map(x=>'#'+x).join(', ')}</small>`:''}</p>`).join('')}</div></details></div>`}).join('')}</div>`
   :`<div class="card empty">${ic('chat',34)}<b>Nenhuma conversa ainda</b><p style="color:var(--muted);margin-top:6px">Abra o site e converse com o assistente para ver como fica.</p><button class="btn btn-gold" data-chat-test style="margin-top:16px">${ic('chat',16)} Testar no site</button></div>`}`);
}
document.getElementById('demo-reset').addEventListener('click',()=>{if(confirm('Restaurar a demonstração? Imóveis, contatos, conversas e configurações voltam ao padrão.')){try{localStorage.removeItem(STORE)}catch(e){}location.reload()}});
render();
</script>
