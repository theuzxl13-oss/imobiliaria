<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demonstração interativa do site e do painel administrativo da Toninho Imóveis.">
<meta property="og:title" content="Toninho Imóveis — Demonstração">
<meta property="og:description" content="Encontre o imóvel ideal para você. Demonstração interativa do site e do painel administrativo.">
<meta name="theme-color" content="#0b2140">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b2140'/%3E%3Cpath d='M12 31 32 14l20 17' fill='none' stroke='%23dfa935' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M22 30h20M32 30v20' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Toninho Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: protótipo navegável do site público + painel, com a identidade do projeto (azul-marinho + dourado). Tema único claro, cores explícitas. */
:root{
  --navy-950:#07152b; --navy-900:#0b2140; --navy-800:#112e55; --navy-700:#173c6d; --navy-500:#2f62a5; --navy-100:#d7e4f4; --navy-50:#eef4fb;
  --gold-600:#a96d18; --gold-500:#c98d1f; --gold-400:#dfa935; --gold-300:#e9bf57; --gold-100:#f9ecc9; --gold-50:#fdf8ec;
  --ink:#0f1b2d; --muted:#5b6678; --soft:#8a94a6; --line:#e3e8ef; --bg:#f7f8fb; --card:#ffffff;
  --rose:#e11d48; --rose-50:#fff1f2; --green:#25d366; --green-dark:#1da851; --emerald:#047857; --emerald-50:#ecfdf5; --amber-50:#fffbeb; --amber:#b45309; --sky-50:#f0f9ff; --sky:#0369a1; --violet-50:#f5f3ff; --violet:#6d28d9; --slate-100:#f1f5f9;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgb(11 33 64/.04),0 8px 24px -8px rgb(11 33 64/.14);
  --shadow-h:0 2px 4px rgb(11 33 64/.06),0 20px 40px -12px rgb(11 33 64/.26);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--navy-500);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;transition:.18s;white-space:nowrap}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-navy{background:var(--navy-800);color:#fff}.btn-navy:hover{background:var(--navy-700)}
.btn-gold{background:var(--gold-400);color:var(--navy-950)}.btn-gold:hover{background:var(--gold-300)}
.btn-out{background:#fff;border:1px solid #cfd6e0;color:var(--ink)}.btn-out:hover{background:var(--navy-50);border-color:var(--navy-100)}
.btn-wa{background:var(--green);color:#fff}.btn-wa:hover{background:var(--green-dark)}
.btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover{background:var(--slate-100)}
.field{width:100%;border:1px solid #cfd6e0;border-radius:12px;padding:10px 12px;background:#fff;font-size:14px}
.field:focus{outline:none;border-color:var(--navy-500);box-shadow:0 0 0 4px rgb(47 98 165/.15)}
label.lb{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-600)}
.h2{font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--navy-950);margin-top:6px}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:3px 8px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.tag-navy{background:rgb(11 33 64/.9);color:#fff}.tag-rose{background:var(--rose);color:#fff}.tag-gold{background:var(--gold-400);color:var(--navy-950)}.tag-dark{background:#0f172a;color:#fff}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st-disponivel{background:var(--emerald-50);color:var(--emerald)}.st-reservado{background:var(--amber-50);color:var(--amber)}.st-vendido{background:var(--sky-50);color:var(--sky)}.st-alugado{background:var(--violet-50);color:var(--violet)}.st-indisponivel{background:var(--slate-100);color:#475569}
.ld-novo{background:var(--rose-50);color:var(--rose)}.ld-em_atendimento{background:var(--amber-50);color:var(--amber)}.ld-contato_realizado{background:var(--sky-50);color:var(--sky)}.ld-visita_agendada{background:var(--violet-50);color:var(--violet)}.ld-finalizado{background:var(--emerald-50);color:var(--emerald)}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* barra da demonstração */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--navy-950);color:#cbd5e1;font-size:12.5px}
.demobar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:7px;flex-wrap:wrap}
.seg{display:inline-flex;background:rgb(255 255 255/.08);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#cbd5e1;font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:8px}
.seg button[aria-pressed=true]{background:var(--gold-400);color:var(--navy-950)}

/* site */
header.site{position:sticky;top:calc(env(safe-area-inset-top,0px) + 41px);z-index:50;background:rgb(255 255 255/.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:70px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.logo b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1;color:var(--navy-950)}
.logo i{display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.32em;color:var(--gold-600);margin-top:3px}
.logo.light b{color:#fff}.logo.light i{color:var(--gold-300)}
nav.main{display:flex;gap:2px}
nav.main button{border:0;background:none;padding:8px 11px;border-radius:9px;font-weight:700;font-size:14px;color:#475569}
nav.main button:hover{background:#f8fafc;color:var(--navy-800)}
nav.main button[aria-current=page]{background:var(--navy-50);color:var(--navy-800)}
.menu-btn{display:none}
@media (max-width:1060px){nav.main{display:none}.menu-btn{display:inline-flex}.hide-md{display:none!important}}
@media (max-width:560px){.hide-sm{display:none!important}}
.mnav{display:grid;gap:4px;padding:10px 0 16px}
.mnav button{border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;font-weight:700;color:#334155}
.mnav button[aria-current=page]{background:var(--navy-50);color:var(--navy-800)}

.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 18% 20%,rgb(223 169 53/.22),transparent 40%),radial-gradient(circle at 85% 0%,rgb(79 127 191/.45),transparent 45%),linear-gradient(135deg,var(--navy-950),var(--navy-800) 55%,var(--navy-700))}
.hero .skyline{position:absolute;inset:auto 0 0 0;height:46%;opacity:.16;pointer-events:none}
.hero .wrap{position:relative;padding-block:64px 52px}
.hero h1{font-size:clamp(34px,5.6vw,60px);font-weight:800;line-height:1.05;max-width:760px}
.hero h1 em{font-style:normal;color:var(--gold-300)}
.hero .lead{margin-top:14px;max-width:560px;color:#d5dde9;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid rgb(255 255 255/.16);background:rgb(255 255 255/.08);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--gold-100)}
.search{margin-top:30px;max-width:1000px;background:#fff;color:var(--ink);border-radius:18px;padding:10px;box-shadow:0 25px 60px -15px rgb(7 21 43/.55)}
.tabs{display:flex;gap:4px;padding:3px}
.tabs button{border:0;background:none;border-radius:9px;padding:7px 18px;font-weight:800;font-size:14px;color:#475569}
.tabs button[aria-pressed=true]{background:var(--navy-800);color:#fff}
.sgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;margin-top:8px}
@media (max-width:860px){.sgrid{grid-template-columns:1fr}}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--gold-500)}
.sbox input,.sbox select{border:0;outline:0;background:transparent;width:100%;padding:13px 0;font-size:14px;color:var(--ink)}
.trust{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:28px;font-size:14px}
.trust span{display:flex;align-items:center;gap:7px;color:#cbd5e1}.trust b{color:#fff}

section.blk{padding-block:56px}
section.white{background:#fff}
.shead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:26px}
.shead p.sub{margin-top:6px;color:var(--muted)}
.link{border:0;background:none;font-weight:800;font-size:14px;color:var(--navy-700);display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

.pcard{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.25s;padding:0;width:100%}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.pcard .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--navy-50)}
.pcard .ph svg.photo{width:100%;height:100%;display:block;transition:transform .5s}
.pcard:hover .ph svg.photo{transform:scale(1.05)}
.pcard .tags{position:absolute;top:10px;left:10px;display:flex;flex-wrap:wrap;gap:5px}
.pcard .code{position:absolute;right:10px;bottom:10px;background:rgb(255 255 255/.92);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;color:#334155}
.pcard .stat{position:absolute;left:10px;bottom:10px}
.pcard .bd{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.pcard .cat{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-600)}
.pcard h3{font-size:15.5px;font-weight:800;color:var(--navy-950);margin-top:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .loc{display:flex;gap:4px;align-items:center;color:var(--soft);font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-block:1px solid #eef1f5;margin-top:14px;padding-block:10px;font-size:12px;color:#475569;text-align:center}
.facts span{display:flex;flex-direction:column;align-items:center;gap:3px}.facts svg{color:var(--navy-500);width:16px;height:16px}
.pcard .ft{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px;flex:1}
.price{font-size:19px;font-weight:800;color:var(--navy-900)}
.price.promo{color:var(--rose)}
.old{font-size:12px;color:var(--soft)}.old s{color:var(--soft)}
.ver{display:inline-flex;align-items:center;gap:4px;background:var(--navy-50);color:var(--navy-800);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800;transition:.2s}
.pcard:hover .ver{background:var(--navy-800);color:#fff}

.cats{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.catb{display:flex;flex-direction:column;align-items:flex-start;gap:12px;border:1px solid var(--line);background:#fafbfd;border-radius:16px;padding:18px;text-align:left;transition:.2s}
.catb:hover{background:#fff;box-shadow:var(--shadow);transform:translateY(-2px)}
.catb .ico{background:var(--navy-800);color:var(--gold-300);border-radius:12px;padding:10px;display:flex}
.catb b{display:block;color:var(--navy-950)}.catb small{color:var(--soft);font-size:12px}

.cta{position:relative;overflow:hidden;border-radius:26px;background:var(--navy-900);color:#fff;padding:44px clamp(22px,4vw,52px);display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:center}
.cta::before{content:"";position:absolute;width:300px;height:300px;right:-90px;top:-110px;border-radius:50%;background:rgb(223 169 53/.22);filter:blur(50px)}
@media (max-width:820px){.cta{grid-template-columns:1fr}}
.cta h2{font-size:clamp(24px,3.2vw,36px);font-weight:800;margin-top:6px}
.cta p{color:#cbd5e1;margin-top:10px;max-width:540px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vals div{border:1px solid var(--line);border-radius:16px;padding:18px}
.vals b{display:block;margin-top:10px;color:var(--navy-950)}.vals small{color:var(--muted);font-size:13px}
.vals svg{color:var(--gold-500);width:26px;height:26px}
footer.site{background:var(--navy-950);color:#94a3b8;margin-top:0}
footer.site .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;padding-block:52px}
@media (max-width:860px){footer.site .cols{grid-template-columns:1fr 1fr}}
@media (max-width:480px){footer.site .cols{grid-template-columns:1fr}}
footer.site h4{color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px}
footer.site li{list-style:none;margin:8px 0;font-size:14px}
footer.site ul{padding:0;margin:0}
footer.site button{border:0;background:none;color:#94a3b8;padding:0}
footer.site button:hover{color:var(--gold-300)}
.fbar{border-top:1px solid rgb(255 255 255/.08);font-size:12px;color:#64748b}
.fbar .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding-block:16px}
.wa-float{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;border:0;background:var(--green);color:#fff;border-radius:50%;padding:14px;box-shadow:0 10px 25px -6px rgb(0 0 0/.35);display:flex}
.wa-float:hover{background:var(--green-dark);transform:scale(1.05)}

/* listagem */
.phero{background:radial-gradient(circle at 80% 0%,rgb(79 127 191/.4),transparent 45%),linear-gradient(135deg,var(--navy-950),var(--navy-800));color:#fff}
.phero .wrap{padding-block:38px}
.crumb{font-size:12px;color:#cbd5e1;margin-bottom:8px}
.phero h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.phero p{color:#cbd5e1;margin-top:6px}
.listing{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;padding-block:30px 56px}
@media (max-width:960px){.listing{grid-template-columns:1fr}}
.filters{padding:20px;align-self:start;position:sticky;top:130px}
@media (max-width:960px){.filters{position:static}}
.filters h3{font-size:15px;font-weight:800;color:var(--navy-950);margin-bottom:14px;display:flex;gap:8px;align-items:center}
.fgroup{margin-bottom:14px}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cnt button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 0;font-size:12px;font-weight:800;color:#475569}
.cnt button[aria-pressed=true]{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.empty{padding:50px 20px;text-align:center}
.empty b{display:block;font-size:18px;color:var(--navy-950);margin-top:10px}

/* imóvel */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:28px;padding-block:8px 50px}
@media (max-width:980px){.pgrid{grid-template-columns:1fr}}
.gal{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:var(--navy-900)}
.gal svg.photo{width:100%;height:100%;display:block}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgb(255 255 255/.92);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#1e293b;box-shadow:0 6px 16px rgb(0 0 0/.2)}
.gal .info{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.gal .info span{background:rgb(0 0 0/.6);color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;width:104px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:0;padding:0;outline:2px solid transparent;opacity:.65}
.thumbs button[aria-current=true]{outline-color:var(--gold-400);opacity:1}
.thumbs svg{width:100%;height:100%;display:block}
.box{padding:22px}
.box h2{font-size:17px;font-weight:800;color:var(--navy-950);margin-bottom:14px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.dgrid{grid-template-columns:1fr 1fr}}
.dgrid div{display:flex;gap:10px;align-items:center;background:#f8fafc;border-radius:12px;padding:10px}
.dgrid .i{background:#fff;border-radius:9px;padding:7px;color:var(--navy-500);display:flex;box-shadow:0 1px 3px rgb(0 0 0/.06)}
.dgrid small{display:block;font-size:11.5px;color:var(--soft)}.dgrid b{color:var(--navy-950)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;padding:0;margin:0}
@media (max-width:560px){.feat{grid-template-columns:1fr 1fr}}
.feat li{list-style:none;display:flex;gap:8px;align-items:center;font-size:14px;color:#334155}
.feat li span{background:var(--emerald-50);color:var(--emerald);border-radius:50%;display:flex;padding:3px}
.side{display:grid;gap:16px;align-self:start}
@media (max-width:980px){.side{position:static}}
.big{font-size:30px;font-weight:800;color:var(--navy-900)}
.big.promo{color:var(--rose)}
.save{display:inline-block;margin-top:6px;background:var(--rose-50);color:#be123c;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:800}
.share{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.share button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 4px;font-size:12px;font-weight:700;color:#334155;display:flex;align-items:center;justify-content:center;gap:5px}

/* overlays */
.lightbox{position:fixed;inset:0;z-index:90;background:rgb(0 0 0/.94);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.lightbox .top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:6px 8px}
.lightbox .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.lightbox .stage svg.photo{max-width:min(1100px,100%);max-height:100%;width:100%;height:auto;aspect-ratio:16/10;border-radius:8px}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgb(255 255 255/.12);color:#fff;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:16px;left:16px;z-index:100;display:grid;justify-items:end;gap:8px;pointer-events:none}
.toast{pointer-events:auto;max-width:420px;background:#fff;border:1px solid #bbf7d0;color:#065f46;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600;box-shadow:0 12px 30px -10px rgb(0 0 0/.25);display:flex;gap:9px;align-items:flex-start;animation:tin .25s ease}
.toast.info{border-color:var(--navy-100);color:var(--navy-800)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.modal{position:fixed;inset:0;z-index:95;background:rgb(7 21 43/.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:440px;width:100%;padding:22px}
.wa-preview{background:#e7f8ee;border-radius:12px 12px 12px 3px;padding:12px 14px;color:#14532d;font-size:14px;margin-top:12px}

/* painel */
.adm{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 41px)}
@media (max-width:900px){.adm{grid-template-columns:1fr}}
.aside{background:var(--navy-950);color:#cbd5e1;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
@media (max-width:900px){.aside{flex-direction:row;overflow-x:auto;padding:10px 12px;gap:6px}.aside .logo,.aside .who{display:none}}
.aside .logo{padding:0 10px 18px}
.aside button.it{border:0;background:none;color:#cbd5e1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font-weight:700;font-size:14px;text-align:left;white-space:nowrap}
.aside button.it:hover{background:rgb(255 255 255/.06);color:#fff}
.aside button.it[aria-current=page]{background:rgb(255 255 255/.1);color:#fff}
.aside button.it[aria-current=page] svg{color:var(--gold-300)}
.aside .badge{margin-left:auto;background:var(--rose);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.aside .who{margin-top:auto;border-top:1px solid rgb(255 255 255/.1);padding:14px 12px 0;font-size:13px}
.amain{padding:28px clamp(16px,3vw,36px) 60px;min-width:0}
.ahead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
.ahead h1{font-size:24px;font-weight:800;color:var(--navy-950)}
.ahead p{color:var(--muted);font-size:14px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.stats .card{padding:16px;text-align:left;border:1px solid var(--line)}
.stats .ic2{display:inline-flex;border-radius:11px;padding:9px}
.stats b{display:block;font-size:26px;font-weight:800;color:var(--navy-950);margin-top:10px;line-height:1.1}
.stats small{color:var(--muted);font-size:12.5px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 14px;border-bottom:1px solid #f1f4f8;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.thumb{width:62px;height:46px;border-radius:9px;overflow:hidden;flex:none}
.thumb svg{width:100%;height:100%;display:block}
.scroll-x{overflow-x:auto}
.menu{position:absolute;right:0;top:100%;margin-top:4px;z-index:30;width:230px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -12px rgb(0 0 0/.25);padding:5px 0}
.menu button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:none;text-align:left;padding:8px 13px;font-size:13.5px;color:#334155}
.menu button:hover{background:#f8fafc}
.menu hr{border:0;border-top:1px solid #f1f4f8;margin:4px 0}
.lead{padding:16px 18px}
.login{min-height:calc(100vh - 41px);display:grid;grid-template-columns:1fr 1fr}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .art{display:none}}
.login .art{padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.note{background:var(--gold-50);border:1px solid var(--gold-100);color:#7c4a0e;border-radius:12px;padding:10px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const brl=n=>n==null?'':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const price=(n,p)=>p==='aluguel'?brl(n)+'/mês':brl(n);
const area=n=>n==null?'—':n.toLocaleString('pt-BR')+' m²';
const hasOffer=p=>p.offer&&p.promo!=null&&p.promo<p.price;
const eff=p=>hasOffer(p)?p.promo:p.price;
const STL={disponivel:'Disponível',reservado:'Reservado',vendido:'Vendido',alugado:'Alugado',indisponivel:'Indisponível'};
const LST={novo:'Novo',em_atendimento:'Em atendimento',contato_realizado:'Contato realizado',visita_agendada:'Visita agendada',finalizado:'Finalizado'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const slug=p=>norm(`${catName(p.cat)} ${p.bed?p.bed+' quartos ':''}${p.nb}`).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+p.code;

const active=()=>visible().filter(p=>!['vendido','alugado','indisponivel'].includes(p.status));

   <div class="ph">${photo(sceneOf(p.cat),p.v)}
    <div class="tags"><span class="tag tag-navy">${p.purpose==='venda'?'À venda':'Para alugar'}</span>${o?'<span class="tag tag-rose">Oferta</span>':''}${p.featured?'<span class="tag tag-gold">Destaque</span>':''}</div>
    <span class="code">Cód. ${p.code}</span>${p.status!=='disponivel'?`<span class="stat tag ${closed?'tag-dark':'tag-gold'}">${STL[p.status]}</span>`:''}</div>

}

function pageList(kind){
  const T={comprar:['Imóveis à Venda','Encontre o imóvel para morar ou investir.'],alugar:['Imóveis para Alugar','Opções para morar ou trabalhar.'],imoveis:['Imóveis','Combine filtros para encontrar o imóvel ideal.'],ofertas:['Ofertas','Imóveis com preço promocional por tempo limitado.']}[kind];
  const f=S.filters;let list=visible();
  if(kind==='comprar')list=list.filter(p=>p.purpose==='venda');
  if(kind==='alugar')list=list.filter(p=>p.purpose==='aluguel');
  if(kind==='ofertas')list=list.filter(hasOffer);
  if(kind==='imoveis'&&f.purpose)list=list.filter(p=>p.purpose===f.purpose);
  if(f.q){const w=norm(f.q).split(/\s+/).filter(Boolean);list=list.filter(p=>w.every(x=>norm(`${p.code} ${p.title} ${p.nb} ${p.city}`).includes(x)))}
  if(f.cat)list=list.filter(p=>p.cat===f.cat);
  if(f.bed)list=list.filter(p=>p.bed>=f.bed);
  if(f.bath)list=list.filter(p=>p.bath>=f.bath);
  if(f.park)list=list.filter(p=>p.park>=f.park);
  if(f.max)list=list.filter(p=>eff(p)<=f.max);
  if(f.min)list=list.filter(p=>eff(p)>=f.min);
  const ord={disponivel:0,reservado:1,vendido:2,alugado:3,indisponivel:4};
  list=[...list].sort((a,b)=>ord[a.status]-ord[b.status]||(f.sort==='menor'?eff(a)-eff(b):f.sort==='maior'?eff(b)-eff(a):b.code.localeCompare(a.code)));
  const cnt=(k,l)=>`<div class="fgroup"><span class="lb" style="display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:5px">${l}</span><div class="cnt">${[0,1,2,3,4].map(n=>`<button type="button" data-cnt="${k}" data-n="${n}" aria-pressed="${(f[k]||0)===n}">${n?n+'+':'Todos'}</button>`).join('')}</div></div>`;
  return `<section class="phero"><div class="wrap"><p class="crumb">Início › ${T[0]}</p><h1>${T[0]}</h1><p>${T[1]}</p></div></section>
  <div class="wrap listing"><aside class="card filters" aria-label="Filtros"><h3>${ic('sliders',16)} Busca avançada</h3>
   ${kind==='imoveis'?`<div class="fgroup"><span style="display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:5px">Negociação</span><div class="cnt" style="grid-template-columns:repeat(3,1fr)">${[['','Todos'],['venda','Venda'],['aluguel','Aluguel']].map(([v,l])=>`<button type="button" data-fp="${v}" aria-pressed="${(f.purpose||'')===v}">${l}</button>`).join('')}</div></div>`:''}
   <div class="fgroup"><label class="lb" for="f-q">Cidade, bairro ou código</label><input class="field" id="f-q" value="${esc(f.q||'')}" placeholder="Ex.: Centro, 0001"></div>
   <div class="fgroup"><label class="lb" for="f-cat">Tipo de imóvel</label><select class="field" id="f-cat"><option value="">Todos os tipos</option>${CATS.map(c=>`<option value="${c[0]}" ${f.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>
   ${cnt('bed','Quartos')}${cnt('bath','Banheiros')}${cnt('park','Vagas')}
   <div class="fgroup"><span style="display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:5px">Valor (R$)</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="field" id="f-min" inputmode="numeric" placeholder="Mínimo" aria-label="Valor mínimo" value="${f.min||''}"><input class="field" id="f-max" inputmode="numeric" placeholder="Máximo" aria-label="Valor máximo" value="${f.max||''}"></div></div>
   <div style="display:flex;gap:8px"><button class="btn btn-out" data-clear style="flex:1">Limpar</button><button class="btn btn-navy" data-apply style="flex:2">Aplicar filtros</button></div></aside>
   <div style="min-width:0"><div class="lhead"><b style="color:var(--navy-950)">${list.length} ${list.length===1?'imóvel encontrado':'imóveis encontrados'}</b>
    <select class="field" id="f-sort" style="width:auto" aria-label="Ordenar"><option value="">Mais recentes</option><option value="menor" ${f.sort==='menor'?'selected':''}>Menor preço</option><option value="maior" ${f.sort==='maior'?'selected':''}>Maior preço</option></select></div>
    ${list.length?grid(list):`<div class="card empty">${ic('search',34)}<b>Nenhum imóvel encontrado</b><p style="color:var(--muted);margin-top:6px">Tente ampliar a busca ou fale com a nossa equipe.</p><button class="btn btn-out" data-clear style="margin-top:16px">Limpar filtros</button></div>`}</div></div>`;
}

  const o=hasOffer(p),n=3,i=S.photo%n,closed=p.status==='vendido'||p.status==='alugado';

   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="tag tag-navy">${p.purpose==='venda'?'À venda':'Para alugar'}</span><span class="tag" style="background:var(--navy-50);color:var(--navy-800)">${catName(p.cat)}</span>${o?'<span class="tag tag-rose">Oferta</span>':''}${p.featured?'<span class="tag tag-gold">Destaque</span>':''}${p.status!=='disponivel'?`<span class="tag tag-dark">${STL[p.status]}</span>`:''}</div>
   <h1 style="font-size:clamp(24px,3vw,32px);font-weight:800;color:var(--navy-950);margin-top:10px">${esc(p.title)}</h1>
   <p style="display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px;margin:6px 0 18px"><span style="display:flex;gap:5px;align-items:center;color:var(--muted)">${ic('pin',15)} ${esc(p.nb)}, ${esc(p.city)}/SP</span><span># Código do imóvel: <b style="color:#334155">${p.code}</b></span></p></div>

   <div><div class="gal">${photo(sc,p.v+i)}

     <button data-lb aria-label="Ampliar foto" style="position:absolute;inset:0 60px;border:0;background:transparent;cursor:zoom-in"></button>
     <div class="info"><span>${i+1}/${n}</span><span style="display:flex;gap:5px;align-items:center">${ic('expand',13)} Ampliar</span></div></div>
    <div class="thumbs">${[0,1,2].map(k=>`<button data-thumb="${k}" aria-current="${k===i}" aria-label="Ver foto ${k+1}">${photo(sc,p.v+k)}</button>`).join('')}</div></div>
   ${closed?`<div class="note">Este imóvel já foi <b>${STL[p.status].toLowerCase()}</b>. Fale com a nossa equipe para conhecer opções semelhantes.</div>`:''}
   <div class="card box"><h2>Detalhes do imóvel</h2><div class="dgrid">${[['bed','Dormitórios',p.bed],['bath','Suítes',p.suite],['bath','Banheiros',p.bath],['car','Vagas',p.park],['building','Área construída',area(p.built)],['land','Área total',area(p.total)]].map(([a,b,c])=>`<div><span class="i">${ic(a)}</span><span><small>${b}</small><b class="num">${c}</b></span></div>`).join('')}</div></div>

  <aside class="side"><div class="card box"><p style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)">${p.purpose==='venda'?'Venda':'Aluguel'}</p>
    ${o?`<p class="old" style="font-size:14px;margin-top:4px">DE: <s>${price(p.price,p.purpose)}</s></p><p class="big promo num"><small style="font-size:15px">POR: </small>${price(p.promo,p.purpose)}</p><span class="save">Economia de ${brl(p.price-p.promo)}</span>`:`<p class="big num" style="margin-top:4px">${price(p.price,p.purpose)}</p>`}
    ${p.condo||p.iptu?`<div style="border-top:1px solid #eef1f5;margin-top:14px;padding-top:12px;font-size:14px;display:grid;gap:6px">${p.condo?`<div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Condomínio</span><b class="num">${brl(p.condo)}/mês</b></div>`:''}${p.iptu?`<div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">IPTU</span><b class="num">${brl(p.iptu)}/ano</b></div>`:''}</div>`:''}
    <button class="btn btn-wa" data-wa="${p.code}" style="width:100%;margin-top:16px;padding:14px;font-size:15px">${wa(18)} Tenho interesse neste imóvel</button></div>
   <form class="card box" id="lead-form" novalidate><h2 style="margin-bottom:4px">Quero mais informações</h2><p style="color:var(--muted);font-size:13px;margin-bottom:14px">Preencha e retornaremos rapidamente.</p>
    <div style="display:grid;gap:10px"><div><label class="lb" for="l-name">Nome *</label><input class="field" id="l-name" required></div>
    <div><label class="lb" for="l-phone">Telefone *</label><input class="field" id="l-phone" type="tel" placeholder="(00) 00000-0000"></div>
    <div><label class="lb" for="l-msg">Mensagem</label><textarea class="field" id="l-msg" rows="3">Olá! Tenho interesse no imóvel código #${p.code}. Aguardo contato.</textarea></div>
    <p id="l-err" style="color:var(--rose);font-size:12.5px;font-weight:600" hidden></p>
    <button class="btn btn-navy" style="width:100%;padding:13px">${ic('send',16)} Tenho interesse</button></div></form>
   <div class="card box"><h2 style="font-size:14px;margin-bottom:10px">Compartilhar imóvel</h2><div class="share"><button data-share="WhatsApp">${wa(14)} WhatsApp</button><button data-share="Facebook">Facebook</button><button data-share="link">${ic('copy',14)} Copiar link</button></div></div></aside></div>
  ${(()=>{const sim=active().filter(x=>x.code!==p.code&&x.purpose===p.purpose).slice(0,4);return sim.length?`<section class="blk white"><div class="wrap"><h2 class="h2" style="margin-bottom:22px">Imóveis semelhantes</h2>${grid(sim)}</div></section>`:''})()}`;
}

  return `<section class="phero"><div class="wrap"><p class="crumb">Início › Anuncie seu imóvel</p><h1>Anuncie seu imóvel</h1><p>Envie os dados do seu imóvel e nossa equipe fará uma avaliação sem compromisso.</p></div></section><div class="wrap" style="padding-block:44px;max-width:820px"><form class="card box" id="req-form" style="padding:28px;display:grid;gap:12px;grid-template-columns:1fr 1fr"><h2 style="grid-column:1/-1">Dados do imóvel</h2><div style="grid-column:1/-1"><label class="lb" for="r-name">Nome *</label><input class="field" id="r-name"></div><div><label class="lb" for="r-phone">Telefone / WhatsApp *</label><input class="field" id="r-phone" type="tel"></div><div><label class="lb" for="r-type">Tipo de imóvel</label><select class="field" id="r-type">${CATS.map(c=>`<option>${c[1]}</option>`).join('')}</select></div><div><label class="lb" for="r-purpose">Venda ou aluguel</label><select class="field" id="r-purpose"><option value="venda">Venda</option><option value="aluguel">Aluguel</option></select></div><div><label class="lb" for="r-city">Cidade</label><input class="field" id="r-city" value="Cidade Modelo"></div><div style="grid-column:1/-1"><label class="lb" for="r-value">Valor aproximado (R$)</label><input class="field" id="r-value" inputmode="numeric" placeholder="Ex.: 350000"></div><div style="grid-column:1/-1"><label class="lb" for="r-desc">Descrição</label><textarea class="field" id="r-desc" rows="4" placeholder="Quartos, área, diferenciais..."></textarea></div><p id="r-err" style="color:var(--rose);font-size:12.5px;font-weight:600;grid-column:1/-1" hidden></p><button class="btn btn-navy" style="grid-column:1/-1;padding:13px">${ic('send',16)} Enviar para avaliação</button></form></div>`;

function admDash(){

function admProps(){

  return adminShell(`<div class="ahead"><div><h1>Gerenciar imóveis</h1><p>${list.length} imóveis. Vendidos e alugados permanecem registrados para histórico.</p></div><button class="btn btn-gold" data-adm="novo">${ic('plus',16)} Cadastrar imóvel</button></div>
   <div class="card" style="padding:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center">${ic('search')}<input class="field" id="adm-q" value="${esc(S.adminQ)}" placeholder="Buscar por código, título, bairro ou cidade..." style="border:0;box-shadow:none"></div>
   <div class="card scroll-x"><table class="tbl"><thead><tr><th>Imóvel</th><th>Categoria</th><th>Negócio</th><th>Preço</th><th>Status</th><th>Cadastro</th><th><span style="position:absolute;left:-9999px">Ações</span></th></tr></thead><tbody>

}

   <div><label class="lb" for="n-area">Área total (m²)</label><input class="field" id="n-area" type="number" value="250"></div></div></div>
   <div class="card box"><h2>Fotos</h2><div style="border:2px dashed #cfd6e0;border-radius:16px;padding:22px;text-align:center;color:var(--muted)">${ic('plus',22)}<p style="font-weight:700;color:var(--navy-900);margin-top:6px">Enviar várias fotos de uma vez</p><p style="font-size:13px">No sistema real as fotos vão para o Supabase Storage, com escolha da foto principal e ordem.</p></div></div>
   <div class="card box"><h2>Publicação</h2><label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" id="n-feat" checked style="width:18px;height:18px;accent-color:#173c6d"> Imóvel em destaque (aparece na página inicial)</label></div>
   <div><button class="btn btn-navy" style="padding:13px 22px">${ic('check',16)} Cadastrar imóvel</button></div></form>`);
}
function admLeads(){
  return adminShell(`<div class="ahead"><div><h1>Interessados</h1><p>Contatos enviados pelos formulários do site, vinculados ao imóvel.</p></div></div>
   <div style="display:grid;gap:12px">${DB.leads.map(l=>`<div class="card lead"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px"><div><b style="color:var(--navy-950)">${esc(l.name)}</b> <span class="pill ld-${l.status}">${LST[l.status]}</span><p style="color:var(--muted);font-size:13px;margin-top:3px">${l.code?`Imóvel #${l.code}`:'Contato geral'} · ${esc(l.phone)} · ${l.date}</p></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600">Status <select class="field" data-lead="${l.id}" style="width:auto">${Object.entries(LST).map(([k,v])=>`<option value="${k}" ${l.status===k?'selected':''}>${v}</option>`).join('')}</select></label></div>
    <p style="background:#f8fafc;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;color:#334155">${esc(l.msg||'(sem mensagem)')}</p></div>`).join('')}</div>`);
}
function admReqs(){
  return adminShell(`<div class="ahead"><div><h1>Anuncie seu imóvel</h1><p>Proprietários que enviaram imóveis para avaliação.</p></div></div>
   <div style="display:grid;gap:12px">${DB.requests.map(r=>`<div class="card lead"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px"><div><b style="color:var(--navy-950)">${esc(r.name)}</b> <span class="pill ld-${r.status}">${LST[r.status]}</span><p style="color:var(--muted);font-size:13px;margin-top:3px">${esc(r.type)} para ${r.purpose} · ${esc(r.city)} · ${r.value?brl(r.value):'valor não informado'} · ${r.date}</p></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600">Status <select class="field" data-req="${r.id}" style="width:auto">${Object.entries(LST).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}</select></label></div>
    <p style="background:#f8fafc;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;color:#334155">${esc(r.desc||'(sem descrição)')}</p></div>`).join('')}</div>`);
}
function admConfig(){
  return adminShell(`<div class="ahead"><div><h1>Configurações da imobiliária</h1><p>Estas informações aparecem automaticamente no site.</p></div></div>
  <div class="card box" style="max-width:820px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">${[['Nome da imobiliária','Toninho Imóveis'],['WhatsApp','55 + DDD + número'],['Telefone','(00) 0000-0000'],['E-mail','contato@toninhoimoveis.com.br'],['Endereço','Rua Exemplo, 100, Centro'],['Instagram','@toninhoimoveis'],['Facebook','facebook.com/toninhoimoveis'],['Horário de atendimento','Seg. a sex., 8h às 18h']].map(([l,v],i)=>`<div><label class="lb" for="cf${i}">${l}</label><input class="field" id="cf${i}" value="${v}"></div>`).join('')}
  <div style="grid-column:1/-1"><label class="lb" for="cf-about">Texto "Sobre nós"</label><textarea class="field" id="cf-about" rows="4">A Toninho Imóveis nasceu para tornar a compra, a venda e a locação de imóveis uma experiência simples, transparente e segura.</textarea></div>
  <div><button class="btn btn-navy" data-save-config>${ic('check',16)} Salvar configurações</button></div></div>`);
}

/* ---------------- render ---------------- */
function render(){
  document.getElementById('mode-site').setAttribute('aria-pressed',S.mode==='site');
  document.getElementById('mode-admin').setAttribute('aria-pressed',S.mode==='admin');
  if(S.mode==='admin'){
    app.innerHTML=({login:admLogin,dash:admDash,imoveis:admProps,novo:admNovo,leads:admLeads,reqs:admReqs,config:admConfig})[S.admin]();
    return;
  }
  let body;
  if(S.page==='home')body=pageHome();
  else if(['comprar','alugar','imoveis','ofertas'].includes(S.page))body=pageList(S.page);
  else if(S.page==='imovel')body=pageProp();
  else body=pageSimple(S.page);
  app.innerHTML=header()+body+footer();
}

/* ---------------- interações ---------------- */
function waModal(code){
  const msg=code==='geral'?'Olá! Vim pelo site da Toninho Imóveis e gostaria de mais informações.':`Olá! Vi o imóvel código #${code} no site da Toninho Imóveis e gostaria de mais informações.`;
  document.getElementById('overlay').innerHTML=`<div class="modal" data-close><div class="card" role="dialog" aria-modal="true" aria-label="Mensagem do WhatsApp"><div style="display:flex;justify-content:space-between;align-items:center"><b style="display:flex;gap:8px;align-items:center;color:#15803d">${wa(20)} Abriria o WhatsApp com:</b><button class="btn btn-ghost btn-sm" data-close aria-label="Fechar">${ic('x',18)}</button></div><div class="wa-preview">${esc(msg)}</div><p style="font-size:12.5px;color:var(--muted);margin-top:12px">No site publicado, o botão abre o WhatsApp da imobiliária (número configurado no painel) com essa mensagem pronta.</p></div></div>`;
}
function lightbox(){
  const p=DB.props.find(x=>x.code===S.code),i=S.photo%3;
  document.getElementById('overlay').innerHTML=`<div class="lightbox" role="dialog" aria-modal="true" aria-label="Galeria ampliada"><div class="top"><b>${i+1} / 3</b><button class="btn btn-ghost" data-close style="color:#fff" aria-label="Fechar galeria">${ic('x',22)}</button></div><div class="stage">${photo(sceneOf(p.cat),p.v+i)}<button class="nav" style="left:10px" data-lbph="-1" aria-label="Foto anterior">${ic('left',24)}</button><button class="nav" style="right:10px" data-lbph="1" aria-label="Próxima foto">${ic('right',24)}</button></div></div>`;
}
function closeOverlay(){document.getElementById('overlay').innerHTML=''}
const now=()=>{const d=new Date();return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
const phoneOk=v=>{const d=v.replace(/\D/g,'');return d.length>=10&&d.length<=13};

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');if(!t)return;
  const d=t.dataset;
  if(t.id==='mode-site'){S.mode='site';render();return}
  if(t.id==='mode-admin'){S.mode='admin';render();window.scrollTo(0,0);return}
  if(d.close!==undefined&&(e.target===t||t.tagName==='BUTTON')){closeOverlay();return}
  if(d.lbph){S.photo=(S.photo+Number(d.lbph)+3)%3;lightbox();render();return}
  if(d.go){go(d.go,{filters:{}});return}
  if(d.mode){S.mode=d.mode;if(d.to)S.admin=d.to;render();window.scrollTo(0,0);return}
  if(d.toggleMenu!==undefined){S.menuOpen=!S.menuOpen;render();return}
  if(d.open){go('imovel',{code:d.open,photo:0});return}
  if(d.cat){go('imoveis',{filters:{cat:d.cat}});return}
  if(d.ptab){S.purposeTab=d.ptab;render();return}
  if(d.wa){waModal(d.wa);return}
  if(d.ph){S.photo=(S.photo+Number(d.ph)+3)%3;render();return}
  if(d.thumb){S.photo=Number(d.thumb);render();return}
  if(d.lb!==undefined){lightbox();return}
  if(d.share){toast(d.share==='link'?'Link copiado!':`Compartilhamento pelo ${d.share} (com foto, título e preço).`,d.share==='link'?'':'info');return}
  if(d.cnt){S.filters={...readFilters(),[d.cnt]:Number(d.n)||undefined};render();return}
  if(d.fp!==undefined){S.filters={...readFilters(),purpose:d.fp||undefined};render();return}
  if(d.apply!==undefined){S.filters=readFilters();render();return}
  if(d.clear!==undefined){S.filters={};render();return}
  if(d.adm){S.admin=d.adm;S.menu=null;if(d.adm==='login')S.mode='admin';render();window.scrollTo(0,0);return}
  if(d.menu){S.menu=S.menu===d.menu?null:d.menu;render();return}
  if(d.act){adminAction(d.act,d.c);return}
  if(d.saveConfig!==undefined){toast('Configurações salvas! O site já foi atualizado.');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOverlay();if(S.menu){S.menu=null;render()}}
  if(document.querySelector(".lightbox")&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){S.photo=(S.photo+(e.key==='ArrowRight'?1:2))%3;lightbox();render()}});
document.addEventListener('change',e=>{
  if(e.target.id==='f-sort'){S.filters={...readFilters(),sort:e.target.value||undefined};render()}
  if(e.target.dataset.lead){const l=DB.leads.find(x=>x.id==e.target.dataset.lead);l.status=e.target.value;toast('Status do atendimento atualizado.');render()}
  if(e.target.dataset.req){const r=DB.requests.find(x=>x.id==e.target.dataset.req);r.status=e.target.value;toast('Status atualizado.');render()}
});
document.addEventListener('input',e=>{if(e.target.id==='adm-q'){S.adminQ=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('adm-q');el.focus();el.setSelectionRange(pos,pos)}});
function readFilters(){const g=id=>document.getElementById(id);const f={...S.filters};if(g('f-q')){f.q=g('f-q').value.trim()||undefined;f.cat=g('f-cat').value||undefined;f.min=Number(g('f-min').value.replace(/\D/g,''))||undefined;f.max=Number(g('f-max').value.replace(/\D/g,''))||undefined}return f}
function adminAction(a,code){
  const p=DB.props.find(x=>x.code===code);S.menu=null;
  const hist=(from,to)=>{(DB.history[code]=DB.history[code]||[]).unshift([STL[from],STL[to],now()])};
  if(a==='ver'){S.mode='site';go('imovel',{code,photo:0});return}
  if(a==='editar'){toast(`Abriria a edição completa do imóvel #${code} (dados, fotos e histórico).`,'info');render();return}
  if(a==='destaque'){p.featured=!p.featured;toast(p.featured?'Imóvel marcado como destaque. Já aparece na página inicial.':'Destaque removido.')}
  if(a==='oferta'){if(p.offer){p.offer=false;p.promo=null;toast('Oferta removida.')}else{p.offer=true;p.promo=Math.round(p.price*0.9/1000)*1000;toast(`Oferta criada: DE ${brl(p.price)} POR ${brl(p.promo)}. Já aparece em Ofertas.`)}}
  if(['disponivel','vendido','alugado'].includes(a)){hist(p.status,a);p.status=a;toast(`Status alterado para ${STL[a]}. Registrado no histórico.`)}
  if(a==='pub'){p.pub=!p.pub;toast(p.pub?'Imóvel publicado no site.':'Imóvel desativado: some do site, mas continua no painel.')}
  if(a==='excluir'){document.getElementById('overlay').innerHTML=`<div class="modal"><div class="card" role="dialog" aria-modal="true"><h2 style="font-size:18px;color:var(--navy-950)">Excluir o imóvel #${code}?</h2><p style="color:var(--muted);margin-top:8px;font-size:14px">${esc(p.title)} e todas as fotos serão excluídos definitivamente.</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button class="btn btn-out" data-close>Cancelar</button><button class="btn" style="background:var(--rose);color:#fff" id="confirm-del" data-c="${code}">Excluir definitivamente</button></div></div></div>`;return}
  render();
}
document.addEventListener('click',e=>{if(e.target.id==='confirm-del'){DB.props=DB.props.filter(p=>p.code!==e.target.dataset.c);closeOverlay();toast('Imóvel excluído.');render()}});
document.addEventListener('submit',e=>{
  e.preventDefault();const id=e.target.id,g=x=>document.getElementById(x);
  if(id==='hero-search'){go(S.purposeTab==='venda'?'comprar':'alugar',{filters:{q:g('hs-q').value.trim()||undefined,cat:g('hs-t').value||undefined,max:Number(g('hs-p').value)||undefined}});return}
  if(id==='lead-form'||id==='contact-form'){
    const pre=id==='lead-form'?'l':'c',name=g(pre+'-name').value.trim(),phone=g(pre+'-phone').value.trim(),err=g(pre+'-err');
    if(name.length<2){err.textContent='Informe seu nome.';err.hidden=false;return}
    if(!phoneOk(phone)){err.textContent='Informe um telefone válido com DDD.';err.hidden=false;return}
    DB.leads.unshift({id:Date.now(),name,phone,email:'',code:id==='lead-form'?S.code:null,msg:g(pre+'-msg').value.trim(),status:'novo',date:now()});
    e.target.innerHTML=`<div style="text-align:center;padding:14px;background:var(--emerald-50);border-radius:14px;color:#065f46">${ic('check',30)}<p style="font-weight:800;margin-top:8px">Mensagem enviada!</p><p style="font-size:13px;margin-top:4px">O contato já aparece no painel, em <b>Interessados</b>.</p><button type="button" class="btn btn-navy btn-sm" data-mode="admin" data-to="leads" style="margin-top:12px">Ver no painel</button></div>`;
    toast('Recebemos sua mensagem! Em breve entraremos em contato.');return}
  if(id==='req-form'){const name=g('r-name').value.trim(),phone=g('r-phone').value.trim(),err=g('r-err');
    if(name.length<2||!phoneOk(phone)){err.textContent='Informe nome e telefone válido com DDD.';err.hidden=false;return}
    DB.requests.unshift({id:Date.now(),name,phone,type:g('r-type').value,purpose:g('r-purpose').value,city:g('r-city').value,value:Number(g('r-value').value.replace(/\D/g,''))||null,desc:g('r-desc').value,status:'novo',date:now()});
    e.target.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:20px;background:var(--emerald-50);border-radius:14px;color:#065f46">${ic('check',30)}<p style="font-weight:800;margin-top:8px">Solicitação enviada para avaliação!</p><button type="button" class="btn btn-navy btn-sm" data-mode="admin" data-to="reqs" style="margin-top:12px">Ver no painel</button></div>`;
    toast('Solicitação enviada para avaliação!');return}
  if(id==='login-form'){S.admin='dash';toast('Bem-vindo ao painel, Toninho!');render();return}
  if(id==='new-form'){const max=Math.max(...DB.props.map(p=>Number(p.code)))+1,code=String(max).padStart(4,'0');
    DB.props.push({code,title:g('n-title').value.trim()||'Novo imóvel',cat:g('n-cat').value,purpose:g('n-purpose').value,status:'disponivel',pub:true,featured:g('n-feat').checked,offer:false,price:Number(g('n-price').value.replace(/\D/g,''))||0,promo:null,city:'Cidade Modelo',nb:g('n-nb').value.trim()||'Centro',bed:Number(g('n-bed').value)||0,suite:1,bath:2,park:2,built:140,total:Number(g('n-area').value)||null,condo:null,iptu:1200,feats:['Quintal','Churrasqueira'],date:new Date().toLocaleDateString('pt-BR'),v:2});
    S.admin='imoveis';toast(`Imóvel ${code} cadastrado! Já aparece no site.`);render();return}
});
render();
</script>
</body>
</html>
